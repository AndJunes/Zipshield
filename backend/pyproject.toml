[project]
name = "zipshield-backend"
version = "1.0.0"
description = "Zipshield API — insurance claims platform with AI photo-evidence review"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.138.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.0.51",
    "psycopg2-binary==2.9.10",
    "alembic==1.16.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "email-validator==2.3.0",
    "pwdlib[argon2,bcrypt]==0.3.1",
    "PyJWT==2.15.1",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "ruff>=0.16",
    "mypy>=1.19",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends(...) in parameter defaults is the FastAPI idiom

[tool.ruff.lint.per-file-ignores]
# conftest must set DATABASE_URL before any app import builds the engine.
"tests/conftest.py" = ["E402"]

[tool.mypy]
files = ["app"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
