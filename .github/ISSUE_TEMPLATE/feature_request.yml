name: Feature request
description: Something you'd like Zipshield to support
labels: [enhancement]
body:
  - type: textarea
    id: feature
    attributes:
      label: What would you like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The workflow it unblocks, or the real-world insurance rule it mirrors.
